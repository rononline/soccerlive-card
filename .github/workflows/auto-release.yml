name: Auto Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  visual:
    uses: ./.github/workflows/visual.yml

  hacs:
    uses: ./.github/workflows/hacs-validate.yml

  release:
    needs: [tests, visual, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build bundle
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Smoke test preview
        if: steps.check.outputs.exists == 'false'
        run: npm run smoke:preview

      - name: Build release notes from changelog
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTE=$(awk -v version="$VERSION" '
            index($0, "## v" version " ") == 1 || $0 == "## v" version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          [ -z "$NOTE" ] && NOTE=$(git log -1 --pretty=%B)
          {
            echo 'notes<<EOF_NOTES'
            echo "$NOTE"
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Verify bundle asset
        if: steps.check.outputs.exists == 'false'
        run: |
          test -s dist/soccer-live-card.bundle.js

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: dist/soccer-live-card.bundle.js
          draft: false
          prerelease: false

      - name: Verify release asset
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=""
          for attempt in 1 2 3 4 5; do
            SIZE=$(gh release view "${{ steps.version.outputs.tag }}" \
              --json assets \
              --jq '.assets[] | select(.name == "soccer-live-card.bundle.js") | .size' \
              2>/dev/null || true)
            [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ] && break
            sleep $((attempt * 2))
          done
          test -n "$SIZE"
          test "$SIZE" -gt 0
