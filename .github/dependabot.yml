version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Bumping @playwright/test also requires bumping the pinned Playwright
      # container image in visual.yml (enforced by check:playwright-sync) and
      # usually regenerating the visual snapshots. That coordination can't be
      # automated, so keep it out of Dependabot and bump it by hand when needed.
      - dependency-name: "@playwright/test"
